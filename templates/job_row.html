<article class="job-row consumer-job-card">
  <div class="consumer-job-card-top">
    <div><span class="consumer-job-category">{{ job.category }}</span>{% if job.demo %}<span class="tag">Sample brief</span>{% endif %}</div>
    <strong class="consumer-job-budget">{{ job.budget_display }}</strong>
  </div>
  <div class="consumer-job-main">
    <h3><a href="{% url 'job_detail' job.pk %}">{{ job.title }}</a></h3>
    <p>{{ job.description|truncatechars:150 }}</p>
  </div>
  <div class="consumer-job-meta">
    <span>By {{ job.owner.display_name }}</span>
    <span>{{ job.project }}</span>
    <span>Due {{ job.deadline|date:'j M Y' }}</span>
  </div>
  <a class="row-action consumer-job-action" href="{% url 'job_detail' job.pk %}">View project</a>
</article>
