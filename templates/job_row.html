<article class="job-row"><div class="job-category">{{ job.category }}{% if job.demo %}<span class="tag">Sample brief</span>{% endif %}</div><div class="job-summary"><h3><a href="{% url 'job_detail' job.pk %}">{{ job.title }}</a></h3><p>{{ job.project }} / Due {{ job.deadline|date:'j M Y' }}</p></div><div class="job-budget"><strong>{{ job.budget_display }}</strong><span>{% if job.payment_asset == 'XLM' %}Fixed test-token amount{% else %}Illustrative USD budget{% endif %}</span></div><a class="row-action" href="{% url 'job_detail' job.pk %}">View brief</a></article>
