name: Push checks
on:
  pull_request:
  push:
    branches: [main, staging]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    env:
      PUSH_DATABASE_URL: local
      PUSH_ENV: development
      PUSH_SECRET_KEY: ci-only-placeholder-not-used-outside-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --noinput
      - run: node --check static/wallet-connect.js
      - run: node --check static/escrow.js
      - run: node --check static/escrow-staff.js
      - run: node --test tests/wallet-state.test.cjs
      - run: python manage.py collectstatic --noinput
      - run: git diff --check
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: push_ci
          POSTGRES_PASSWORD: push_ci
          POSTGRES_DB: push_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U push_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PUSH_DATABASE_URL: postgresql://push_ci:push_ci@localhost:5432/push_ci?sslmode=disable
      PUSH_ENV: development
      PUSH_SECRET_KEY: disposable-ci-only-not-a-deployment-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python manage.py test core.test_escrow core.test_escrow_staff --noinput
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable test --locked --workspace
        working-directory: contracts
