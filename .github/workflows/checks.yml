name: Push checks
on:
  pull_request:
  push:
    branches: [main, staging]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    env:
      PUSH_DATABASE_URL: local
      PUSH_ENV: development
      PUSH_SECRET_KEY: ci-only-placeholder-not-used-outside-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --noinput
      - run: node --check static/wallet-connect.js
      - run: node --test tests/wallet-state.test.cjs
      - run: python manage.py collectstatic --noinput
      - run: git diff --check
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable test --locked -p push-milestone
        working-directory: contracts
